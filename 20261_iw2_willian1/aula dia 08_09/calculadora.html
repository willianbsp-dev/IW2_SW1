<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function(){
            function calcular(operacao){
                let n1 = $('#n1').val();
                let resultado = $('.resultado').text();

                if (n1 === '' || isNaN(n1)) {
                    alert("Por favor, digite um número válido!");
                    return;
                }
            
                $.ajax({
                    url: 'script.php',
                    type: 'POST',
                    data: {
                        n1: n1,
                        resultado: resultado,
                        button: operacao
                    },
                    dataType: 'html'
                }).done(function(resposta){
                    // Animação no Resultado
                    $('.resultado')
                        .addClass('atualizado')
                        .html(resposta)
                        .one('animationend', function() {
                            $(this).removeClass('atualizado');
                        });
                    
                    // Insere item no histórico com animação de slide
                    let novoItem = $('<div class="item-historico">' + resposta + '</div>');
                    $('.lista').prepend(novoItem);
                }).fail(function(jqXHR, textStatus){
                    alert("Request failed: " + textStatus);
                });
            };

            $('.bMais').click(() => calcular('+'));
            $('.bMenos').click(() => calcular('-'));
            $('.bVezes').click(() => calcular('*'));
            $('.bDiv').click(() => calcular('/')); 
        })
    </script>
    <style>
        /* RESET UNIVERSAL */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-rendering: optimizeLegibility;
        }

        input, button {
            font: inherit;
            color: inherit;
            border: none;
            outline: none;
            background: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        /* LAYOUT & DEGRADÊ DE FUNDO DINÂMICO */
        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background: #08090b;
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 159, 10, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(52, 199, 89, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, #121418 0%, #08090b 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 20px;
            overflow-x: hidden;
        }

        /* CORPO DA CALCULADORA ULTRA MODERNO */
        .calculadora-card {
            background: rgba(22, 24, 29, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%;
            max-width: 350px;
            padding: 28px;
            border-radius: 32px;
            box-shadow: 
                0 30px 60px -12px rgba(0, 0, 0, 0.9),
                0 0 40px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: springPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .marca {
            text-align: center;
            color: #ff9f0a;
            font-size: 0.75rem;
            letter-spacing: 4px;
            margin-bottom: 22px;
            font-weight: 800;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 159, 10, 0.3);
        }

        /* VISOR DIGITAL NEON */
        .visor {
            background: rgba(10, 11, 14, 0.8);
            border-radius: 20px;
            padding: 18px 20px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 
                inset 0 4px 12px rgba(0, 0, 0, 0.8),
                0 0 20px rgba(0, 0, 0, 0.2);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .visor:focus-within {
            border-color: rgba(255, 159, 10, 0.4);
            box-shadow: 
                inset 0 4px 12px rgba(0, 0, 0, 0.8),
                0 0 15px rgba(255, 159, 10, 0.2);
        }

        .inputs-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 8px;
            position: relative;
        }

        input[type="number"] {
            width: 100%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #a0a5b5;
            font-size: 1.2rem;
            text-align: right;
            padding: 6px 0;
            border-radius: 0;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            color: #ffffff;
            border-bottom-color: #ff9f0a;
        }

        .resultado-container {
            text-align: right;
            padding-top: 8px;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .resultado {
            font-size: 2.2rem;
            font-weight: bold;
            color: #34c759;
            text-shadow: 0 0 12px rgba(52, 199, 89, 0.4);
            word-break: break-all;
            transition: transform 0.2s ease;
        }

        .resultado:empty::before {
            content: "0";
            color: #353842;
        }

        /* GRID DE BOTÕES DE ALTA INTERAÇÃO */
        .botoes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        button {
            position: relative;
            background: linear-gradient(145deg, #ffaf33, #ff9f0a);
            color: #ffffff;
            height: 60px;
            width: 100%;
            font-size: 1.6rem;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 
                0 6px 0 #b36e00, 
                0 10px 15px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 8px 0 #b36e00, 
                0 12px 20px rgba(255, 159, 10, 0.3);
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 
                0 2px 0 #b36e00, 
                0 4px 8px rgba(0, 0, 0, 0.4);
        }

        /* HISTÓRICO ANIMADO */
        .lista {
            width: 100%;
            max-width: 350px;
            max-height: 140px;
            overflow-y: auto;
            background: rgba(18, 20, 24, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 12px 16px;
            color: #8a8f9e;
            font-size: 0.9rem;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        .item-historico {
            animation: slideDownIn 0.4s ease forwards;
            padding: 4px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
        }

        .lista::-webkit-scrollbar {
            width: 5px;
        }

        .lista::-webkit-scrollbar-thumb {
            background-color: #2e3035;
            border-radius: 10px;
        }

        /* ANIMAÇÕES KEYFRAMES */
        @keyframes springPop {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(40px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .resultado.atualizado {
            animation: superGlow 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .proxima {
            width: auto;
            height: auto;
            padding: 20px;
        }

        a.proxima {
            display: inline-block;
            background: linear-gradient(145deg, #ffaf33, #ff9f0a);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: 700;
            box-shadow: 0 4px 0 #b36e00, 0 8px 12px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }
        
        a.proxima:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #b36e00, 0 10px 15px rgba(255, 159, 10, 0.3);
        }

        @keyframes superGlow {
            0% {
                transform: scale(0.9);
                color: #34c759;
            }
            50% {
                transform: scale(1.15);
                color: #ffffff;
                text-shadow: 0 0 25px rgba(52, 199, 89, 0.9), 0 0 35px rgba(52, 199, 89, 0.6);
            }
            100% {
                transform: scale(1);
                color: #34c759;
                text-shadow: 0 0 12px rgba(52, 199, 89, 0.4);
            }
        }

        @keyframes slideDownIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="calculadora-card">
        <div class="marca">Calculadora</div>

        <div class="visor">
            <div class="inputs-container">
                <input type="number" id="n1" placeholder="N1: 0">
            </div>
            <div class="resultado-container">
                <div class="resultado"></div>
            </div>
        </div>

        <div class="botoes">
            <button class="bMais">+</button>
            <button class="bMenos">-</button>
            <button class="bVezes">×</button>
            <button class="bDiv">÷</button>
        </div>
    </div>

    <div class="lista"></div>
    <a href="../aula dia 30_09/conexão.html" class="proxima">Proxima</a>
</body>
</html>
