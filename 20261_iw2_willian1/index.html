<!DOCTYPE html>
<html>
<head>

<script>
$(document).ready(function(){
  $("#soma").click(function(){
    let soma = 2 + 4
    $("div").html("<h1>" + soma + "</h1>");
    $("h2").html("calculo: num1 + num2");
  });
  $("#sub").click(function(){

  });
  $("#mult").click(function(){

    $("div").html("<h1>" + mult + "</h1>");

  });
  $("#dividir").click(function(){

  });

  });
});
</script>
